<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Current Weather</title>
</head>
<body>
    <h1>Current Weather</h1>
    <Button onclick="getWeather()">Get Weather</Button>
</body>
<script>
    const apiKey="089ae0a3030eccd98432caca12f73f82";

    async function getWeather(){

        console.log("Prompt opened." + Date());
        const city = prompt("Enter a city name");
         console.log("Prompt opened." + Date());

        if(!city){
            alert("No city entered");
            console.log("No city ebtered." + Date());
            return;
        }

        const url = `https://api.openweathermap.org/data/2.5/weather?q=${city}&appid${apiKey}&units=metric`;

        try{
            const response = await fetch(url);
            if(!response.ok) throw new Error("City not Found");

            const data = await response.json();

            const weatherResult = document.getElemtById("weatherResult");
            weatherResult.innerHTML=`
            <h2>${data.name}, ${data.sys.country}</h2>
            <p>Temparature: ${data.main.temp} </p>
            <p>Weather: ${data.weather[0].discription}</p>
            <p>Humidity: ${data.main.humidity}%</p>
            <p>Wind Speed: ${data.wind.speed} m/s</p>

            `;

        }catch (error){
            alert("Error:"+ error.message);
            console.log("Error:"+ error.message);
        }
    }
</script>
</html>
